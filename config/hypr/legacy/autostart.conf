$terminal = kitty
$fileManager = nautilus

exec-once = swaybg -m solid -c 000000
exec-once = waybar
exec-once = swaync

# Actualizar entorno para servicios systemd --user y reiniciar EmeBotEme
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY
exec-once = systemctl --user restart emeboteme.service

# Iniciar sesión gráfica y portal para diálogos de archivos (Chrome/Firefox)
exec-once = systemctl --user start graphical-session.target
exec-once = systemctl --user start xdg-desktop-portal.service

# Applets de Red y Bluetooth
exec-once = nm-applet --indicator
exec-once = blueman-applet

# Gestor de Portapapeles (Cliphist)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store