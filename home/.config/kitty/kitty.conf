# Lanzador oscuro — Kitty

foreground              #EDE8F5
background              #141020
selection_foreground    #FFFFFF
selection_background    #8B5CF6

# Cursor
cursor                  #E8C547
cursor_text_color       #141020

# Enlaces
url_color               #B79CFF

# Bordes de ventana
active_border_color     #8B5CF6
inactive_border_color   #241C35
bell_border_color       #E8C547

# Barra de título
wayland_titlebar_color  system
macos_titlebar_color    system

# Pestañas
active_tab_foreground   #141020
active_tab_background   #E8C547
inactive_tab_foreground #A396B8
inactive_tab_background #241C35
tab_bar_background      #141020

# Marcas
mark1_foreground #FFFFFF
mark1_background #8B5CF6
mark2_foreground #141020
mark2_background #E8C547
mark3_foreground #141020
mark3_background #A396B8

# Paleta ANSI

# negro
color0  #141020
color8  #3A2C52

# rojo
color1  #FF6B81
color9  #FF8FA3

# verde
color2  #7EE787
color10 #A6E3A1

# amarillo
color3  #E8C547
color11 #F2D06B

# azul
color4  #8B5CF6
color12 #A78BFA

# magenta
color5  #B79CFF
color13 #CBA6F7

# cian
color6  #7DCFFF
color14 #A5D6FF

# blanco
color7  #EDE8F5
color15 #FFFFFF

# Ajustes
font_family      JetBrainsMono Nerd Font
font_size        11.0
bold_font        auto
italic_font      auto
bold_italic_font auto

# Transparencia
background_opacity 0.92
confirm_os_window_close 0

# Cursor
cursor_shape beam
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 2000

# Campana
enable_audio_bell no

# Ventana
window_padding_width 10

# Atajos
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
