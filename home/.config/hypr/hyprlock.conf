# Lanzador oscuro — pantalla de bloqueo

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    color = rgba(20, 16, 32, 1.0)
}

input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    rounding = 12
    inner_color = rgba(30, 24, 44, 0.92)
    outer_color = rgba(139, 92, 246, 1.0)
    check_color = rgba(232, 197, 71, 1.0)
    fail_color = rgba(255, 107, 129, 1.0)
    font_color = rgba(237, 232, 245, 1.0)
    font_family = Noto Sans
    fade_on_empty = false
    placeholder_text = Contraseña…
    dots_size = 0.22
    dots_spacing = 0.3
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(232, 197, 71, 1.0)
    font_size = 72
    font_family = Noto Sans
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = rgba(163, 150, 184, 1.0)
    font_size = 18
    font_family = Noto Sans
    position = 0, 30
    halign = center
    valign = center
}
